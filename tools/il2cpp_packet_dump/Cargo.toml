[package]
name = "maple-il2cpp-packet-dump"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic MapleStory Classic IL2CPP opcode/packet-shape and PCAP dumper"

[dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
hex = "0.4.3"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
