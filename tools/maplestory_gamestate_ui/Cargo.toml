[package]
name = "maple-gamestate-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "egui dashboard for the MapleStory Classic live state-fold proxy"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
