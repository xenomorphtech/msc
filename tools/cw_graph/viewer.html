<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Native client function graph</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10161e;color:#dfe8f0;font:14px system-ui,sans-serif}header{padding:16px 24px;border-bottom:1px solid #304052}h1{font-size:20px;margin:0 0 5px}header p{margin:0;color:#a6b6c7}main{display:grid;grid-template-columns:55% 45%;height:calc(100vh - 90px)}svg{width:100%;height:100%;background:#131e2a}aside{overflow:auto;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 monospace;background:#0b1119;padding:18px}button{background:#243a50;border:1px solid #587894;color:white;padding:6px 12px;cursor:pointer}.node{cursor:pointer}.node text{fill:#e6edf3;font:11px monospace;pointer-events:none}.edge{stroke:#566e85;stroke-width:1.2;opacity:.65}.edge.selected{stroke:#e8bd68;stroke-width:2;opacity:1}.node circle{fill:#33758d;stroke:#87c7df;stroke-width:1.5}.node.external circle{fill:#6e526f;stroke:#c495c2}.node.center circle{fill:#a36b28;stroke:#ffcd76}.node.selected circle{stroke:white;stroke-width:3}a{color:#90d4ed}.badge{font:12px monospace;color:#90d4ed}#details{color:#a6b6c7;font-size:12px;line-height:1.6}#edges{font:12px monospace;white-space:pre-wrap}footer{margin-top:12px;color:#a6b6c7;font-size:12px}
</style>
<header><h1>Native client · function graph</h1><p id="summary"></p></header>
<main><svg id="graph" viewBox="0 0 1000 850"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="20" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8da8bf"/></marker></defs><g id="scene"></g></svg><aside><span class="badge" id="status"></span><h2 id="name"></h2><p id="details"></p><button id="download">Save this function as C</button><pre id="source"></pre><h3>Call sites in this view</h3><div id="edges"></div><footer>Recovered pseudocode. Imported functions have no local body. Unresolved indirect targets are retained separately in the database.</footer></aside></main>
<script>
const data=/*GRAPH_DATA*/null;
const ns='http://www.w3.org/2000/svg',scene=document.getElementById('scene'),svg=document.getElementById('graph');
const byId=new Map(data.nodes.map((n,i)=>[n.id,{...n,i,x:500+330*Math.cos(i*2*Math.PI/data.nodes.length),y:425+330*Math.sin(i*2*Math.PI/data.nodes.length),vx:0,vy:0}]));
const nodes=[...byId.values()],edges=data.edges.map(e=>({...e,a:byId.get(e.source),b:byId.get(e.target)}));
function make(tag,attrs,parent){const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));parent.append(el);return el}
for(const edge of edges)edge.el=make('line',{class:'edge','marker-end':'url(#arrow)'},scene);
let selected;
function select(node){selected=node;document.getElementById('name').textContent=node.qualified_name||node.name;document.getElementById('status').textContent='decompile: '+node.status+' · compile: '+(node.compile_status||'pending')+' · test: '+(node.test_status||'pending')+' · integration: '+(node.integration_status||'pending');document.getElementById('details').textContent=node.id+'\n'+node.signature;document.getElementById('source').textContent=node.c||node.error||'No local body';const lines=edges.filter(e=>e.source===node.id||e.target===node.id).map(e=>`${e.site_rva}  ${e.kind}  ${e.a.name} → ${e.b.name}`);lines.push(...(data.unresolved||[]).filter(s=>s.caller===node.id).map(s=>`${s.site_rva}  unresolved  ${s.instruction}`));document.getElementById('edges').textContent=lines.join('\n');for(const n of nodes)n.el.classList.toggle('selected',n===node);for(const e of edges)e.el.classList.toggle('selected',e.source===node.id||e.target===node.id)}
let drag;
function point(event){const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
for(const node of nodes){node.el=make('g',{class:'node'+(node.is_external?' external':'')+(node.id===data.center?' center':'')},scene);make('circle',{r:node.id===data.center?16:10},node.el);const text=make('text',{x:15,y:4},node.el);text.textContent=node.name.length>36?node.name.slice(0,33)+'…':node.name;const title=make('title',{},node.el);title.textContent=node.qualified_name+' '+node.rva;node.el.addEventListener('pointerdown',e=>{drag=node;svg.setPointerCapture(e.pointerId);select(node)});node.el.addEventListener('click',()=>select(node))}
svg.addEventListener('pointermove',e=>{if(drag){const p=point(e);drag.x=p.x;drag.y=p.y;drag.vx=drag.vy=0}});svg.addEventListener('pointerup',()=>drag=null);
let tick=0;
function frame(){if(tick++<500||drag){for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d2=Math.max(dx*dx+dy*dy,100),force=1800/d2;a.vx+=dx*force/Math.sqrt(d2);a.vy+=dy*force/Math.sqrt(d2);b.vx-=dx*force/Math.sqrt(d2);b.vy-=dy*force/Math.sqrt(d2)}}for(const e of edges){if(e.a===e.b)continue;const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-160)*.003;e.a.vx+=dx*f/d;e.a.vy+=dy*f/d;e.b.vx-=dx*f/d;e.b.vy-=dy*f/d}for(const n of nodes){if(n!==drag){n.vx=(n.vx+(500-n.x)*.0008)*.88;n.vy=(n.vy+(425-n.y)*.0008)*.88;n.x=Math.max(30,Math.min(970,n.x+n.vx));n.y=Math.max(30,Math.min(820,n.y+n.vy))}n.el.setAttribute('transform',`translate(${n.x},${n.y})`)}for(const e of edges){e.el.setAttribute('x1',e.a.x);e.el.setAttribute('y1',e.a.y);e.el.setAttribute('x2',e.b.x);e.el.setAttribute('y2',e.b.y)}}requestAnimationFrame(frame)}
document.getElementById('summary').textContent=`${nodes.length} functions · ${edges.length} call-site edges${data.truncated?' · bounded view; more neighbors are in the database':''} · click a function to inspect its code`;
document.getElementById('download').onclick=()=>{if(!selected)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([selected.c||'/* '+selected.status+' */'],{type:'text/plain'}));a.download=selected.name.replace(/[^a-zA-Z0-9_.-]/g,'_')+'.c';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
select(byId.get(data.center));frame();
</script></html>
